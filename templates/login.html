<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Вхід - Warehouse System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box fade-in">
            <h1>Warehouse System</h1>

            <div id="error-message" class="error-message"></div>

            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('login')">Вхід</button>
                <button class="tab-btn" onclick="showTab('register')">Реєстрація</button>
            </div>

            <!-- Форма входу -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label>Логін</label>
                    <input type="text" id="login-username" required autocomplete="username" placeholder="Введіть логін">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="login-password" required autocomplete="current-password" placeholder="Введіть пароль">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Увійти</button>
            </form>

            <!-- Форма реєстрації -->
            <form id="register-form" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label>Логін</label>
                    <input type="text" id="register-username" required autocomplete="username" placeholder="Введіть логін">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="register-password" required autocomplete="new-password" placeholder="Введіть пароль">
                </div>
                <div class="form-group">
                    <label>Підтвердіть пароль</label>
                    <input type="password" id="register-password-confirm" required autocomplete="new-password" placeholder="Повторіть пароль">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Зареєструватися</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
